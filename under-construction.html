<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --bg: light-dark(#fafafa, #0a0b0e);
      --text-primary: light-dark(#111827, #f3f4f6);
      --text-secondary: light-dark(#6b7280, #9ca3af);
      --border: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.12));
      --accent: light-dark(#059669, #34d399);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 440px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
      animation: pulse 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
      }
      70% {
        box-shadow: 0 0 0 7px rgba(52, 211, 153, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
      }
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      font-weight: 400;
    }

    .divider {
      width: 32px;
      height: 1px;
      background-color: var(--border);
      margin-top: 0.5rem;
    }

    footer {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="status-badge">
      <span class="pulse-dot" aria-hidden="true"></span>
      <span>In Development</span>
    </div>

    <h1>Under Construction</h1>

    <p>
      We are currently building something new. The website will be online shortly.
    </p>

    <div class="divider" aria-hidden="true"></div>

    <footer>
      <span>&copy; 2026 &bull; Check back soon</span>
    </footer>
  </main>
</body>
</html>
